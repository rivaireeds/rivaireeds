name: Update Stock Signals

on:
  schedule:
    # 매주 월~금 07:30 UTC = 한국시간(KST) 16:30
    # (코스피/코스닥 장마감 15:30 이후, 시세 데이터가 안정적으로 반영되는 시점)
    - cron: "30 7 * * 1-5"
  workflow_dispatch: {}   # Actions 탭에서 "Run workflow" 버튼으로 수동 실행도 가능

permissions:
  contents: write   # signals.json을 리포지토리에 다시 commit/push 하기 위해 필요

jobs:
  update-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # 전체 종목(약 2,500개) 스캔 시 넉넉하게 시간 확보

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 매수신호 계산 스크립트 실행
        run: python update_stocks.py

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/signals.json
          git diff --cached --quiet && echo "변경사항 없음, 커밋 생략" || git commit -m "chore: 매수신호 데이터 자동 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
