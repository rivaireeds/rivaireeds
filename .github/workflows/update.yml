name: Update Stock Signals

on:
  schedule:
    - cron: "30 7 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 매수신호 계산 스크립트 실행
        run: python update_stocks.py

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --cached --quiet && echo "변경사항 없음, 커밋 생략" || git commit -m "chore: 매수신호 데이터 자동 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
