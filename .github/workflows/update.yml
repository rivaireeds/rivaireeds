name: Update Stock Signals

on:
  schedule:
    # 매주 월~금 07:30 UTC = 한국시간(KST) 16:30
    # (코스피/코스닥 장마감 15:30 이후, 시세 데이터가 안정적으로 반영되는 시점)
    - cron: "30 7 * * 1-5"
  workflow_dispatch: {}   # Actions 탭에서 "Run workflow" 버튼으로 수동 실행도 가능

permissions:
  contents: write   # 수집된 데이터를 리포지토리에 다시 commit/push 하기 위해 필요

jobs:
  update-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # 무료 라이브러리 사용으로 속도가 대폭 빨라져 15분이면 충분합니다.

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 무료 금융 수집 라이브러리 및 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install pandas finance-datareader pykrx requests beautifulsoup4 lxml

      - name: 주식 데이터 및 기술 신호 수집 스크립트 실행
        run: python update_stocks.py

      - name: 수집 결과 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # api 폴더 내에 생성된 모든 json 파일들을 대상에 추가합니다.
          git add api/*.json
          
          # 변경사항이 있는지 확인 후 안전하게 푸시합니다.
          git diff --cached --quiet && echo "변경사항 없음, 커밋 생략" || git commit -m "chore: 실시간 주식 및 신호 데이터 자동 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
