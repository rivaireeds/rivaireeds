name: Auto Update Stock Engine

on:
  schedule:
    - cron: '30 7 * * 1-5' # 매일 월~금 한국 시간 오후 4시 30분 자동 실행
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼 활성화

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy
        
    - name: Run AI Analysis Engine
      run: python update_stocks.py
      
    - name: Commit & Push JSON Artifacts
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add api/*.json
        git diff-index --quiet HEAD || git commit -m "🤖 AI 분석 및 실시간 시세 아티팩트 자동 갱신 [skip ci]"
        git push
