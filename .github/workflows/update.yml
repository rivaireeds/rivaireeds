name: Auto Update Stock Prices

on:
  schedule:
    # 매일 월~금 한국 시간 오후 4시 30분(장 마감 후) 자동 실행 (UTC 기준 오전 7시 30분)
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # 필요할 때 우리가 버튼을 눌러서 즉시 실행하는 기능 활성화

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 파일 수정 후 다시 저장할 수 있는 권한 부여
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance
        
    - name: Run Update Script
      run: python update_stocks.py
      
    - name: Commit & Push Changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add api/stocks.json api/signals.json
        git diff-index --quiet HEAD || git commit -m "🤖 주가 실시간 자동 업데이트 [skip ci]"
        git push
