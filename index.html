<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>국내주식 매수신호 스캐너 & 차트 분석기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark">●</span>
      <span class="brand-text">신호탐지기<span class="brand-sub">KR STOCK SIGNAL SCANNER</span></span>
    </div>
    <div class="update-info" id="updateInfo">
      <span class="update-label">최종 갱신</span>
      <span class="update-time" id="updateTime">-</span>
    </div>
  </div>
</header>

<main class="wrap">

  <section class="stat-row" id="statRow">
    <div class="stat-card">
      <div class="stat-num" id="statScanned">-</div>
      <div class="stat-label">스캔 완료 (국내 전 종목)</div>
    </div>
    <div class="stat-card highlight">
      <div class="stat-num" id="statSignals">-</div>
      <div class="stat-label">매수 신호 포착 종목</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statFavorites" style="color: #f0b64d;">0</div>
      <div class="stat-label">등록된 관심종목</div>
    </div>
  </section>

  <section class="control-row">
    <input type="text" id="searchBox" class="search-box" placeholder="종목명 또는 초성, 티커 검색 (예: 삼성전자, 005930)" />

    <div class="filter-chips" id="filterChips">
      <button class="chip active" data-filter="ALL">전체</button>
      <button class="chip" data-filter="FAVORITE" style="color: #f0b64d; font-weight: 600;">★ 관심종목</button>
      <button class="chip" data-filter="RSI과매도탈출">RSI탈출</button>
      <button class="chip" data-filter="거래량급증">거래량급증</button>
      <button class="chip" data-filter="MACD골든크로스">MACD</button>
      <button class="chip" data-filter="피보나치지지">피보나치지지</button>
    </div>

    <select id="sortSelect" class="sort-select">
      <option value="score_desc">신호점수 높은순</option>
      <option value="change_desc">등락률 높은순</option>
      <option value="volume_desc">거래량배수 높은순</option>
      <option value="name_asc">종목명순</option>
    </select>
  </section>

  <div class="main-layout">
    <section class="table-section">
      <table class="signal-table">
        <thead>
          <tr>
            <th style="width: 40px; text-align: center;">관심</th>
            <th class="col-score">신호</th>
            <th class="col-name">종목</th>
            <th class="col-price">현재가</th>
            <th class="col-change
